<!doctype html><meta charset="utf-8"><title>Glucometer</title>
<style>html,body{margin:0}body{width:900px;height:900px;position:relative;overflow:hidden;background:radial-gradient(circle at 40% 30%,#d9d2c5,#a89f90)}
.meter{position:absolute;left:250px;top:90px;width:400px;height:720px;border-radius:70px 70px 90px 90px;background:linear-gradient(160deg,#2e3b4e,#161d29);transform:rotate(7deg);box-shadow:0 30px 50px rgba(0,0,0,.5)}
.screen{position:absolute;left:40px;top:60px;width:320px;height:230px;border-radius:22px;background:#c8d8bd;box-shadow:inset 0 0 18px rgba(0,0,0,.45);font-family:"Courier New",monospace;color:#1d2a17}
.val{position:absolute;left:0;right:0;top:50px;text-align:center;font:700 120px/1 "Courier New",monospace;letter-spacing:-4px}
.u{position:absolute;right:18px;bottom:48px;font:700 20px "Courier New"}.t{position:absolute;left:18px;top:14px;font:700 16px "Courier New"}.d{position:absolute;left:18px;bottom:14px;font:700 16px "Courier New"}
.btn{position:absolute;left:150px;top:350px;width:100px;height:100px;border-radius:50%;background:#e8eef7;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25)}
.brand{position:absolute;left:0;right:0;top:520px;text-align:center;color:#8fb1d9;font:700 26px Helvetica;letter-spacing:5px}
.strip{position:absolute;left:170px;bottom:-30px;width:60px;height:110px;background:#f4f4f4;border-radius:6px}</style>
<div class="meter"><div class="screen"><div class="t">AM · BEFORE MEAL</div><div class="val">126</div><div class="u">mg/dL</div><div class="d">06 OCT</div></div><div class="btn"></div><div class="brand">GLUCOCHECK</div><div class="strip"></div></div>
